<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PizzaLatina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<style>
  #login-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, #111, #222);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
    font-family: Arial, sans-serif;
  }

  #login-box {
    background-color: #1c1c1c;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 0 20px #0f0;
    text-align: center;
  }

  #login-box h2 {
    margin-bottom: 20px;
  }

  #login-box input {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 250px;
    border: none;
    border-radius: 5px;
  }

  #login-box button {
    padding: 10px 20px;
    border: none;
    background-color: #0f0;
    color: black;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  #logout-button {
    position: fixed;
    top: 15px;
    right: 15px;
    background-color: red;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none;
    z-index: 10000;
  }
</style>

<div id="login-screen">
  <div id="login-box">
    <h2>Iniciar Sesión</h2>
    <input type="text" id="usuario" placeholder="Usuario" />
    <input type="password" id="contrasena" placeholder="Contraseña" />
    <button onclick="iniciarSesion()">Entrar</button>
  </div>
</div>

<button id="logout-button" onclick="cerrarSesion()">Cerrar sesión</button>

<script>
  function iniciarSesion() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('logout-button').style.display = 'block';

    const mensaje = document.createElement('div');
    mensaje.textContent = '✅ Se inició sesión';
    mensaje.style.backgroundColor = '#d4edda';
    mensaje.style.color = '#155724';
    mensaje.style.padding = '10px';
    mensaje.style.margin = '10px';
    mensaje.style.border = '1px solid #c3e6cb';
    mensaje.style.borderRadius = '5px';
    document.body.insertBefore(mensaje, document.body.firstChild);
  }

  function cerrarSesion() {
    location.reload();
  }
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <div id="navbar-placeholder"></div>
  
  <!-- Secciones de la página -->
  <div id="inicio" class="seccion activa">
    <div class="slider">
      <div class="slides">
        <div class="slide"><img src="images/Render1.jpg" alt="Promoción 1"></div>
        <div class="slide"><img src="images/render2.jpg" alt="Promoción 2"></div>
        <div class="slide"><img src="images/render3.jpg" alt="Promoción 3"></div>
      </div>
      <button class="prev">❮</button>
      <button class="next">❯</button>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/script.js"></script>
  <script src="js/include-nav-footer.js"></script>
</body>
</html>
